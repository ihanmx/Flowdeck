name: CI

on:
  push:
    branches: [main]
  pull_request:

# jobs are the main building blocks of a workflow. A workflow can have multiple jobs, which can run sequentially or in parallel.
jobs:
  # test: job name can be anything, but it should be descriptive. It is used to reference the job in other jobs (like `needs`).
  test:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    # A throwaway Postgres for the pipeline to run migrations/tests against
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowdeck
          POSTGRES_PASSWORD: flowdeck
          POSTGRES_DB: flowdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowdeck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    #stepss :ordered list of commands
    steps:
      # uses: — run a prebuilt, reusable action (someone else's packaged step) instead of a raw shell command.
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://flowdeck:flowdeck@localhost:5432/flowdeck?schema=public

      - run: pnpm --filter api exec eslint "src/**/*.ts"

      - run: pnpm --filter api exec tsc --noEmit

      - name: Test
        run: pnpm --filter api test
        env:
          DATABASE_URL: postgresql://flowdeck:flowdeck@localhost:5432/flowdeck?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - run: pnpm --filter api build

  docker:
    name: Build & push image
    needs: test # only runs if `test` passed
    if: github.ref == 'refs/heads/main' # only on main, not PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # allows pushing to GHCR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/ihanmx/flowdeck-api:latest

#   the steps
#           checkout — clone your repo into the runner.
# pnpm/action-setup + setup-node (with cache: pnpm) — install pnpm & Node, cache dependencies for speed.
# pnpm install --frozen-lockfile — exact, reproducible install (fails if the lockfile is stale).
# prisma generate — build the typed client.
# prisma migrate deploy — apply your migrations to the throwaway DB (proves your migrations actually work on a fresh database — a real safety net).
# eslint + tsc --noEmit — the exact checks you've been running by hand, now automated on every push.
# test — runs Jest.
# build — nest build, proving it compiles for production.
